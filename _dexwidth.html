<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>width harness</title>
<style>html,body{margin:0;background:#111}iframe{border:0;display:block}</style></head>
<body><iframe id="f" src="pokedex.html"></iframe>
<script>
var q = new URLSearchParams(location.search);
var f = document.getElementById('f');
f.style.width = (q.get('w') || '320') + 'px';
f.style.height = (q.get('h') || '1600') + 'px';
if (q.get('hash')) f.src = 'pokedex.html#' + q.get('hash');
</script></body></html>
